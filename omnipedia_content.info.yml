name: Omnipedia - Content
type: module
description: Provides content-related functionality for Omnipedia.
package: Omnipedia
core_version_requirement: ^10.3 || ^11.0
php: 8.1

dependencies:
  - drupal:datetime_range
  - drupal:node
  - drupal:user
  - omnipedia_core:omnipedia_core
  - omnipedia_date:omnipedia_date
  - ambientimpact_core:ambientimpact_core
  - ambientimpact_markdown:ambientimpact_markdown
  - ambientimpact_ux:ambientimpact_ux
  - hook_event_dispatcher:core_event_dispatcher
  - hook_event_dispatcher:views_event_dispatcher
  - hux:hux
  - markdown:markdown

config_devel:
  optional:
    - core.entity_view_display.media.image.omnipedia_infobox
    - core.entity_view_mode.media.omnipedia_infobox
    - image.style.omnipedia_infobox_1300x2600
    - image.style.omnipedia_infobox_325x650
    - image.style.omnipedia_infobox_650x1300
    - responsive_image.styles.omnipedia_infobox
